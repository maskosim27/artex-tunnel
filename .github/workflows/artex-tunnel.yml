name: artex-tunnel

# ARTEX di GitHub Actions + Cloudflare Quick Tunnel.
# v4 (26 Nov 2026, cepet): JANGAN pakai setup token sama sekali.
# Token tidak pernah ketangkap dari `docker compose logs` di runner
# (run #4 dan #5: health OK, token 0 baris). Sebagai gantinya workflow
# membuat password admin sendiri via reset-password.sh resmi ARTEX,
# lalu restart ARTEX. Login langsung pakai username ARTEX + password
# itu — tidak perlu halaman /setup / token.
# Yang WAJIB disembunyikan dari log: URL tunnel + password admin.
# Keduanya hanya dikirim ke Telegram via Secrets.
# Cara pakai: Actions tab -> artex-tunnel -> Run workflow.
# Tunggu pesan Telegram, buka URL, login sebagai ARTEX.
# Satu run tahan sampai 6 jam, lalu jalankan lagi bila perlu.
#
# Secrets yang wajib diisi dulu (repo Settings > Secrets and variables
# > Actions > New repository secret):
#   TELEGRAM_BOT_TOKEN - token dari @BotFather
#   TELEGRAM_CHAT_ID   - chat id kamu (dari @userinfobot / getUpdates)

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/az /opt/microsoft || true
          sudo docker system prune -af --volumes || true
          df -h

      - name: Clone ARTEX
        run: git clone --depth 1 https://github.com/BaaRai/ARTEX artex

      - name: Start ARTEX
        working-directory: artex
        run: |
          set -euo pipefail
          PW=$(openssl rand -hex 16)
          printf 'POSTGRES_USER=artex\nPOSTGRES_DB=artex\nPOSTGRES_PASSWORD=%s\n' "$PW" > .env
          docker compose up -d --build
          echo "Waiting for ARTEX (up to 5 min)..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then
              echo "ARTEX is up"
              break
            fi
            sleep 10
          done
          curl -fsS http://127.0.0.1:8787/api/health
          # Buat password admin langsung via script resmi ARTEX — TIDAK
          # perlu setup token / halaman /setup sama sekali. Username admin
          # ARTEX itu tetap "ARTEX". Password ini HANYA dikirim via Telegram,
          # tidak pernah dicetak di log.
          ADMIN_PASS=$(openssl rand -hex 12)
          echo "::add-mask::$ADMIN_PASS"
          printf '%s' "$ADMIN_PASS" > /tmp/artex-admin-pass.txt
          chmod 600 /tmp/artex-admin-pass.txt
          chmod +x ./reset-password.sh
          ./reset-password.sh -m docker -p "$ADMIN_PASS" -y
          echo "Admin password set, restarting ARTEX..."
          docker compose restart artex
          echo "Waiting for ARTEX after restart (up to 5 min)..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then
              echo "ARTEX is up after restart"
              break
            fi
            sleep 10
          done
          curl -fsS http://127.0.0.1:8787/api/health

      - name: Open tunnel and notify via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::Isi dulu Secrets TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID di repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          # Jalan di background, output HANYA ke file (tidak ke log job).
          /tmp/cloudflared tunnel --url http://127.0.0.1:8787 > /tmp/cf.log 2>&1 &
          CF_PID=$!
          echo "Waiting for tunnel URL (up to 5 min)..."
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$URL" ]; then
            echo "::error::Tunnel URL tidak muncul"
            exit 1
          fi
          echo "::add-mask::$URL"
          ADMIN_PASS=$(cat /tmp/artex-admin-pass.txt 2>/dev/null || true)
          if [ -z "$ADMIN_PASS" ]; then
            echo "::error::Admin password file hilang"
            exit 1
          fi
          echo "::add-mask::$ADMIN_PASS"
          MESSAGE=$(printf 'ARTEX siap!\n\nURL: %s\nUsername: ARTEX\nPassword: %s\n\nBuka URL, login dengan username + password di atas. Tidak perlu setup token. Link + password ini hanya berlaku selama run ini jalan (maks 6 jam).' "$URL" "$ADMIN_PASS")
          RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")
          case "$RESP" in
            *'"ok":true'*) echo "Telegram sent, tunnel running - job stays alive up to 6h" ;;
            *) echo "::error::Gagal kirim Telegram (cek bot token / chat id)"; exit 1 ;;
          esac
          # Jaga run tetap hidup selama tunnel jalan.
          wait "$CF_PID"
