name: artex-tunnel

# ARTEX di GitHub Actions + Cloudflare Quick Tunnel.
# Keputusan Maskosim 26 Nov 2026: setup token BOLEH terlihat di log —
# token saja tidak berguna tanpa URL tunnel. Yang WAJIB disembunyikan
# dari log adalah URL tunnel: URL + token dikirim ke Telegram.
# Cara pakai: Actions tab -> artex-tunnel -> Run workflow.
# Tunggu pesan Telegram, buka URL dari pesan itu, masukkan token.
# Satu run tahan sampai 6 jam, lalu jalankan lagi bila perlu.
#
# Secrets yang wajib diisi dulu (repo Settings > Secrets and variables
# > Actions > New repository secret):
#   TELEGRAM_BOT_TOKEN - token dari @BotFather
#   TELEGRAM_CHAT_ID   - chat id kamu (dari @userinfobot / getUpdates)

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/az /opt/microsoft || true
          sudo docker system prune -af --volumes || true
          df -h

      - name: Clone ARTEX
        run: git clone --depth 1 https://github.com/BaaRai/ARTEX artex

      - name: Start ARTEX
        working-directory: artex
        run: |
          set -euo pipefail
          PW=$(openssl rand -hex 16)
          printf 'POSTGRES_USER=artex\nPOSTGRES_DB=artex\nPOSTGRES_PASSWORD=%s\n' "$PW" > .env
          docker compose up -d --build
          echo "Waiting for ARTEX (up to 5 min)..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then
              echo "ARTEX is up"
              break
            fi
            sleep 10
          done
          curl -fsS http://127.0.0.1:8787/api/health
          # Ambil setup token dari log container. Token BOLEH terlihat di log
          # (keputusan Maskosim: token saja tidak berguna tanpa URL tunnel).
          # PENTING: langkah ini TIDAK BOLEH menggagalkan run — kalau token
          # tidak ketemu, tetap lanjut ke tunnel + Telegram.
          TOKEN=""
          for i in $(seq 1 12); do
            LOGS=$(docker compose logs --no-color --no-log-prefix artex 2>&1 || true)
            if [ -z "$LOGS" ]; then
              CID=$(docker compose ps -q artex 2>/dev/null || true)
              if [ -n "$CID" ]; then
                LOGS=$(docker logs "$CID" 2>&1 || true)
              fi
            fi
            TOKEN=$(printf '%s' "$LOGS" | grep -i "setup token" | tail -1 | grep -oE '[0-9a-f]{32}' | tail -1 || true)
            if [ -n "$TOKEN" ]; then
              break
            fi
            echo "token attempt $i/12: log lines=$(printf '%s' "$LOGS" | wc -l), setup-token lines=$(printf '%s' "$LOGS" | grep -ci "setup token" || true)"
            sleep 5
          done
          printf '%s' "$TOKEN" > /tmp/artex-token.txt
          chmod 600 /tmp/artex-token.txt
          if [ -n "$TOKEN" ]; then
            echo "--- setup token (dibutuhkan di halaman /setup) ---"
            printf '%s' "$LOGS" | grep -i "setup token" | tail -2 || true
            echo "Setup token captured"
          else
            echo "::warning::Setup token tidak ditemukan di log container — lanjut ke tunnel, token bisa dicek di log step ini"
            docker compose ps || true
          fi

      - name: Open tunnel and notify via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::Isi dulu Secrets TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID di repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          # Jalan di background, output HANYA ke file (tidak ke log job).
          /tmp/cloudflared tunnel --url http://127.0.0.1:8787 > /tmp/cf.log 2>&1 &
          CF_PID=$!
          echo "Waiting for tunnel URL (up to 5 min)..."
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$URL" ]; then
            echo "::error::Tunnel URL tidak muncul"
            exit 1
          fi
          echo "::add-mask::$URL"
          TOKEN=$(cat /tmp/artex-token.txt 2>/dev/null || true)
          if [ -n "$TOKEN" ]; then
            MESSAGE=$(printf 'ARTEX siap!\n\nURL: %s\nSetup token: %s\n\nBuka URL, masukkan token di /setup, lalu buat password admin. Link + token ini hanya berlaku selama run ini jalan (maks 6 jam).' "$URL" "$TOKEN")
          else
            MESSAGE=$(printf 'ARTEX siap!\n\nURL: %s\nSetup token: TIDAK KETEMU di log container — cek log step Start ARTEX, cari baris "Setup token for the /setup page".\n\nBuka URL, masukkan token di /setup, lalu buat password admin. Link ini hanya berlaku selama run ini jalan (maks 6 jam).' "$URL")
          fi
          RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")
          case "$RESP" in
            *'"ok":true'*) echo "Telegram sent, tunnel running - job stays alive up to 6h" ;;
            *) echo "::error::Gagal kirim Telegram (cek bot token / chat id)"; exit 1 ;;
          esac
          # Jaga run tetap hidup selama tunnel jalan.
          wait "$CF_PID"
