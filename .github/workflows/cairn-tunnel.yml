name: cairn-tunnel

on:
  workflow_dispatch:

jobs:
  cairn:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/share/boost /usr/local/lib/android /opt/az \
            /opt/microsoft || true
          sudo docker system prune -af --volumes || true
          df -h

      - name: Validate secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAIRN_ANTHROPIC_AUTH_TOKEN: ${{ secrets.CAIRN_ANTHROPIC_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || {
            echo "::error::Missing TELEGRAM_BOT_TOKEN secret"; exit 1;
          }
          [ -n "${TELEGRAM_CHAT_ID:-}" ] || {
            echo "::error::Missing TELEGRAM_CHAT_ID secret"; exit 1;
          }
          [ -n "${CAIRN_ANTHROPIC_AUTH_TOKEN:-}" ] || {
            echo "::error::Missing CAIRN_ANTHROPIC_AUTH_TOKEN secret"; exit 1;
          }
          echo "Required secrets are present."

      - name: Clone Cairn
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/oritera/Cairn.git cairn

      - name: Create Cairn dispatcher configuration
        working-directory: cairn
        env:
          CAIRN_ANTHROPIC_AUTH_TOKEN: ${{ secrets.CAIRN_ANTHROPIC_AUTH_TOKEN }}
          CAIRN_ANTHROPIC_BASE_URL: ${{ secrets.CAIRN_ANTHROPIC_BASE_URL }}
          CAIRN_ANTHROPIC_MODEL: ${{ secrets.CAIRN_ANTHROPIC_MODEL }}
        run: |
          set -euo pipefail
          export TSEC_AGENT_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TSEC_AGENT_TOKEN"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def y(value: str) -> str:
              # JSON string literals are valid YAML scalars and safely quote
              # API keys or values containing punctuation/newlines.
              return json.dumps(value)

          api_key = os.environ["CAIRN_ANTHROPIC_AUTH_TOKEN"]
          base_url = os.environ.get("CAIRN_ANTHROPIC_BASE_URL", "").strip()
          model = os.environ.get("CAIRN_ANTHROPIC_MODEL", "").strip()

          if not base_url:
              base_url = "https://api.deepseek.com/anthropic"
          if not model:
              model = "deepseek-v4-pro"

          config = f'''# Generated at workflow runtime. Do not commit this file.
          server: "http://cairn-server:8000"

          common_env:
            TSEC_SERVER_HOST: "127.0.0.1:8000"
            TSEC_AGENT_TOKEN: {y(os.environ["TSEC_AGENT_TOKEN"])}

          runtime:
            interval: 3
            max_workers: 2
            max_running_projects: 1
            max_project_workers: 2
            healthcheck_timeout: 20
            worker_healthcheck: "startup_only"
            prompt_group: "default"

          tasks:
            bootstrap:
              timeout: 300
              conclude_timeout: 90
            reason:
              timeout: 300
              max_intents: 2
            explore:
              timeout: 300
              conclude_timeout: 90

          container:
            image: "ghcr.io/oritera/cairn-worker-container:latest"
            network_mode: "host"
            completed_action: "stop"

          workers:
            - name: "cairn-claudecode"
              type: "claudecode"
              task_types: [bootstrap, reason, explore]
              max_running: 2
              priority: 0
              env:
                ANTHROPIC_MODEL: {y(model)}
                ANTHROPIC_BASE_URL: {y(base_url)}
                ANTHROPIC_AUTH_TOKEN: {y(api_key)}
          '''

          # Remove the common indentation introduced by the Python literal.
          import textwrap
          Path("dispatch.yaml").write_text(textwrap.dedent(config), encoding="utf-8")
          os.chmod("dispatch.yaml", 0o600)
          PY

          # Do not print dispatch.yaml: it contains API credentials.
          echo "Cairn dispatcher configuration created."

      - name: Build and start Cairn
        working-directory: cairn
        run: |
          set -euo pipefail

          # Upstream Compose publishes 8000 on every interface. Restrict it to
          # loopback so the only remote entry point is the authenticated proxy.
          sed -i 's/"8000:8000"/"127.0.0.1:8000:8000"/' docker-compose.yaml
          grep -q '127.0.0.1:8000:8000' docker-compose.yaml || {
            echo "::error::Could not restrict Cairn port to loopback"; exit 1;
          }

          # Required by Cairn's Docker-based dispatcher.
          docker pull --platform=linux/amd64 ghcr.io/oritera/cairn-worker-container:latest
          docker compose up -d --build

          echo "Waiting for Cairn server..."
          READY=0
          for i in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8000/projects >/dev/null; then
              READY=1
              break
            fi
            sleep 10
          done
          [ "$READY" -eq 1 ] || {
            echo "::error::Cairn server did not become healthy"; exit 1;
          }

          # Give the dispatcher time to parse its YAML and initialize its worker driver.
          sleep 10
          DISPATCHER_STATE="$(docker inspect --format '{{.State.Status}}' cairn-dispatcher 2>/dev/null || true)"
          DISPATCHER_RESTARTS="$(docker inspect --format '{{.RestartCount}}' cairn-dispatcher 2>/dev/null || echo 99)"
          [ "$DISPATCHER_STATE" = "running" ] && [ "$DISPATCHER_RESTARTS" = "0" ] || {
            echo "::error::Cairn dispatcher failed to stay running. Check the dispatcher configuration and LLM provider secrets.";
            exit 1;
          }
          echo "Cairn server and dispatcher are running."

      - name: Install authenticated reverse proxy
        env:
          CAIRN_BASIC_USER: cairn
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx apache2-utils

          CAIRN_BASIC_PASS="$(openssl rand -hex 18)"
          echo "::add-mask::$CAIRN_BASIC_PASS"
          printf '%s\n%s\n' "$CAIRN_BASIC_PASS" "$CAIRN_BASIC_PASS" \
            | sudo htpasswd -ci /etc/nginx/.htpasswd "$CAIRN_BASIC_USER" >/dev/null
          sudo chown root:www-data /etc/nginx/.htpasswd
          sudo chmod 640 /etc/nginx/.htpasswd

          sudo tee /etc/nginx/sites-available/cairn >/dev/null <<'NGINX'
          server {
              listen 127.0.0.1:8080;
              server_name _;
              client_max_body_size 25m;

              location / {
                  auth_basic "Cairn Private";
                  auth_basic_user_file /etc/nginx/.htpasswd;

                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 3600s;
                  proxy_buffering off;
              }
          }
          NGINX

          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sfn /etc/nginx/sites-available/cairn /etc/nginx/sites-enabled/cairn
          sudo nginx -t
          sudo systemctl restart nginx

          # Verify that the proxy rejects anonymous access and accepts the
          # generated credentials before creating the public tunnel.
          UNAUTH_CODE="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/projects)"
          AUTH_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --user "$CAIRN_BASIC_USER:$CAIRN_BASIC_PASS" http://127.0.0.1:8080/projects)"
          [ "$UNAUTH_CODE" = "401" ] || {
            echo "::error::Basic Auth proxy did not reject anonymous requests"; exit 1;
          }
          [ "$AUTH_CODE" = "200" ] || {
            echo "::error::Basic Auth proxy authentication test failed"; exit 1;
          }

          printf '%s' "$CAIRN_BASIC_PASS" > /tmp/cairn-basic-pass.txt
          chmod 600 /tmp/cairn-basic-pass.txt
          echo "Authenticated proxy is ready."

      - name: Open Cloudflare Tunnel and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAIRN_BASIC_USER: cairn
        run: |
          set -euo pipefail

          CAIRN_BASIC_PASS="$(cat /tmp/cairn-basic-pass.txt)"
          echo "::add-mask::$CAIRN_BASIC_PASS"

          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

          # Keep the tunnel URL out of the Actions log.
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 \
            >/tmp/cairn-cloudflared.log 2>&1 &
          CF_PID=$!
          trap 'kill "$CF_PID" 2>/dev/null || true' EXIT

          echo "Waiting for Cloudflare Quick Tunnel..."
          URL=""
          for i in $(seq 1 30); do
            URL="$(grep -oE 'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
              /tmp/cairn-cloudflared.log 2>/dev/null | head -1 || true)"
            if [ -n "$URL" ]; then
              break
            fi
            sleep 10
          done

          [ -n "$URL" ] || {
            echo "::error::Cloudflare Tunnel URL was not created"; exit 1;
          }
          echo "::add-mask::$URL"

          MESSAGE="$(printf 'CAIRN SIAP!\n\nURL: %s\nUsername: %s\nPassword: %s\n\nLogin dilindungi Basic Auth oleh reverse proxy. Cairn berjalan di GitHub Actions dan sesi ini aktif selama workflow berjalan (maksimal 6 jam).\n\nGunakan hanya untuk pengujian pada sistem yang kamu miliki atau yang secara eksplisit mengizinkan pengujian.' \
            "$URL" "$CAIRN_BASIC_USER" "$CAIRN_BASIC_PASS")"

          RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")"

          if printf '%s' "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram notification sent. Tunnel is running."
          else
            echo "::error::Telegram notification failed. Check TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.";
            exit 1
          fi

          # Keep the Actions job alive while cloudflared is running.
          wait "$CF_PID"
