# XALGORIX di GitHub Actions + Cloudflare Quick Tunnel.
# Jalankan dari Actions -> xalgorix-tunnel -> Run workflow.
# Dashboard hanya di-bind ke 127.0.0.1 runner dan diakses lewat Cloudflare.
# Username/password dashboard dibuat acak setiap run dan dikirim via Telegram.
# Container memakai image resmi prebuilt; tidak build source dari GitHub.
# Maksimal satu run 6 jam. Data di volume Docker hanya hidup selama runner aktif.

name: xalgorix-tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/share/boost /usr/local/lib/android /opt/az \
            /opt/microsoft 2>/dev/null || true
          sudo docker system prune -af --volumes || true
          df -h

      - name: Start Xalgorix, open tunnel, and notify Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional LLM configuration. Leave unset to configure it later
          # from Xalgorix Dashboard -> Settings -> LLM.
          XALGORIX_LLM: ${{ secrets.XALGORIX_LLM }}
          XALGORIX_API_KEY: ${{ secrets.XALGORIX_API_KEY }}
          XALGORIX_API_BASE: ${{ secrets.XALGORIX_API_BASE }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::error::Tambahkan TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID di GitHub Actions Secrets."
            exit 1
          fi

          APP_CONTAINER="xalgorix"
          IMAGE="ghcr.io/xalgord/xalgorix:latest"
          APP_PORT="9137"
          CF_PID=""

          cleanup() {
            if [[ -n "${CF_PID}" ]]; then
              kill "${CF_PID}" >/dev/null 2>&1 || true
            fi
            docker rm -f "${APP_CONTAINER}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          # Credentials are generated for this run and never printed in logs.
          export XALGORIX_USERNAME="xalgorix"
          export XALGORIX_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${XALGORIX_PASSWORD}"

          echo "Pulling official Xalgorix image..."
          docker pull "${IMAGE}"

          # Bind only to runner loopback. Cloudflare is the only public entry.
          # Least-privilege capabilities follow the upstream Docker guidance.
          DOCKER_ARGS=(
            run -d
            --name "${APP_CONTAINER}"
            --restart unless-stopped
            --publish "127.0.0.1:${APP_PORT}:${APP_PORT}"
            --volume xalgorix-data:/data
            --cap-add NET_ADMIN
            --cap-add NET_RAW
            --cap-add SYS_PTRACE
            --security-opt seccomp=unconfined
            --env XALGORIX_BIND=0.0.0.0
            --env XALGORIX_USERNAME
            --env XALGORIX_PASSWORD
            --env XALGORIX_DATA_DIR=/data
            --env XALGORIX_ALLOW_LOCAL_TARGETS=false
            --env XALGORIX_NO_AUTO_UPDATE=1
          )

          # Pass LLM settings only when supplied; otherwise configure in UI.
          [[ -n "${XALGORIX_LLM:-}" ]] && DOCKER_ARGS+=(--env XALGORIX_LLM)
          [[ -n "${XALGORIX_API_KEY:-}" ]] && DOCKER_ARGS+=(--env XALGORIX_API_KEY)
          [[ -n "${XALGORIX_API_BASE:-}" ]] && DOCKER_ARGS+=(--env XALGORIX_API_BASE)

          DOCKER_ARGS+=("${IMAGE}")
          docker "${DOCKER_ARGS[@]}" >/dev/null

          echo "Waiting for Xalgorix login endpoint (up to 10 minutes)..."
          LOGIN_PAYLOAD="$(jq -cn \
            --arg username "${XALGORIX_USERNAME}" \
            --arg password "${XALGORIX_PASSWORD}" \
            '{username:$username,password:$password}')"
          READY="false"
          for i in $(seq 1 60); do
            HTTP_CODE="$(curl -sS --max-time 8 \
              -o /tmp/xalgorix-login.json \
              -w '%{http_code}' \
              -c /tmp/xalgorix-cookies.txt \
              -H 'Content-Type: application/json' \
              -X POST "http://127.0.0.1:${APP_PORT}/api/auth/login" \
              --data "${LOGIN_PAYLOAD}" 2>/dev/null || true)"
            if [[ "${HTTP_CODE}" == "200" ]]; then
              AUTH_CODE="$(curl -sS --max-time 8 \
                -b /tmp/xalgorix-cookies.txt \
                -o /tmp/xalgorix-auth-status.json \
                -w '%{http_code}' \
                "http://127.0.0.1:${APP_PORT}/api/auth/status" 2>/dev/null || true)"
              if [[ "${AUTH_CODE}" == "200" ]]; then
                READY="true"
                break
              fi
            fi
            sleep 10
          done

          if [[ "${READY}" != "true" ]]; then
            echo "::error::Xalgorix belum siap atau login gagal. Potongan log container:"
            docker logs --tail 80 "${APP_CONTAINER}" 2>&1 | sed -E \
              -e "s/${XALGORIX_PASSWORD}/[REDACTED]/g" || true
            exit 1
          fi
          echo "Xalgorix is ready and dashboard authentication is verified."

          echo "Installing cloudflared..."
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

          # Keep tunnel output in a file so its public URL never enters Actions logs.
          /tmp/cloudflared tunnel --no-autoupdate \
            --url "http://127.0.0.1:${APP_PORT}" \
            >/tmp/cloudflared.log 2>&1 &
          CF_PID=$!

          echo "Waiting for Cloudflare Quick Tunnel URL (up to 5 minutes)..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL="$(grep -oE 'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log 2>/dev/null | head -1 || true)"
            if [[ -n "${TUNNEL_URL}" ]]; then
              break
            fi
            if ! kill -0 "${CF_PID}" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done

          if [[ -z "${TUNNEL_URL}" ]]; then
            echo "::error::Cloudflare Quick Tunnel URL tidak muncul."
            tail -n 30 /tmp/cloudflared.log 2>/dev/null || true
            exit 1
          fi
          echo "::add-mask::${TUNNEL_URL}"

          if [[ -n "${XALGORIX_LLM:-}" && -n "${XALGORIX_API_KEY:-}" ]]; then
            LLM_NOTE="LLM: sudah dikonfigurasi melalui GitHub Secrets (${XALGORIX_LLM})."
          else
            LLM_NOTE="LLM: belum dikonfigurasi. Buka Settings > LLM setelah login, lalu masukkan provider dan API key."
          fi

          MESSAGE="$(printf '%s\n\nURL: %s\nUsername: %s\nPassword: %s\n\n%s\n\nDashboard aktif selama workflow berjalan (maksimal 6 jam). Data scan pada runner ini bersifat sementara dan hilang setelah run berakhir. Gunakan hanya untuk target yang kamu miliki atau memiliki izin tertulis untuk diuji.' \
            'XALGORIX SIAP!' "${TUNNEL_URL}" "${XALGORIX_USERNAME}" \
            "${XALGORIX_PASSWORD}" "${LLM_NOTE}")"

          TELEGRAM_RESPONSE="$(curl -sS --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")"
          if ! jq -e '.ok == true' >/dev/null <<<"${TELEGRAM_RESPONSE}"; then
            echo "::error::Gagal mengirim Telegram. Periksa bot token dan chat ID."
            exit 1
          fi

          echo "Telegram notification sent. Tunnel is running until the job ends."
          wait "${CF_PID}"
