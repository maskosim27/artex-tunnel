name: pentagi-tunnel-v5-simple

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean || true
          df -h

      - name: Clone PentAGI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/vxcontrol/pentagi.git pentagi
          cd pentagi
          cp .env.example .env
          touch example.custom.provider.yml example.ollama.provider.yml example.bedrock.provider.yml

      - name: Start PentAGI and Cloudflare Quick Tunnel (no Basic Auth)
        shell: bash
        env:
          OPEN_AI_KEY: ${{ secrets.OPEN_AI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LLM_SERVER_URL: ${{ secrets.LLM_SERVER_URL }}
          LLM_SERVER_KEY: ${{ secrets.LLM_SERVER_KEY }}
          LLM_SERVER_MODEL: ${{ secrets.LLM_SERVER_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX_KEY: ${{ secrets.GOOGLE_CX_KEY }}
          TRAVERSAAL_API_KEY: ${{ secrets.TRAVERSAAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          # ---------- 1. Validasi secret ----------
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::error::Isi GitHub Secrets TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID terlebih dahulu."
            exit 1
          fi

          BUILTIN_LLM_KEYS="${OPEN_AI_KEY:-}${ANTHROPIC_API_KEY:-}${GEMINI_API_KEY:-}${DEEPSEEK_API_KEY:-}${GLM_API_KEY:-}${KIMI_API_KEY:-}${QWEN_API_KEY:-}${MINIMAX_API_KEY:-}${MISTRAL_API_KEY:-}${XAI_API_KEY:-}"
          CUSTOM_LLM_READY=0
          if [[ -n "${LLM_SERVER_URL:-}" && -n "${LLM_SERVER_KEY:-}" && -n "${LLM_SERVER_MODEL:-}" ]]; then
            CUSTOM_LLM_READY=1
          fi
          if [[ -z "$BUILTIN_LLM_KEYS" && "$CUSTOM_LLM_READY" != "1" ]]; then
            echo "::error::PentAGI memerlukan minimal satu provider LLM atau LLM_SERVER_URL+KEY+MODEL."
            exit 1
          fi

          cd pentagi

          # ---------- 2. Start PentAGI ----------
          docker compose up -d
          echo "Menunggu PentAGI siap di :8443 ..."
          READY=0
          for i in $(seq 1 180); do
            if curl -kfsS -o /dev/null "https://127.0.0.1:8443/" 2>/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [[ "$READY" != "1" ]]; then
            echo "::error::PentAGI tidak merespons di :8443"
            docker compose ps || true
            docker compose logs --tail=80 || true
            exit 1
          fi
          echo "PentAGI OK."

          # ---------- 3. Start cloudflared dengan JSON output ----------
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

          # PentAGI memakai HTTPS self-signed di 8443 → pakai --no-tls-verify
          /tmp/cloudflared tunnel --no-autoupdate --no-tls-verify --output json \
            --url https://127.0.0.1:8443 \
            > /tmp/cloudflared.json.log 2>&1 &
          CF_PID=$!

          echo "Menunggu URL Cloudflare Quick Tunnel ..."
          TUNNEL_URL=""
          for i in $(seq 1 60); do
            # Prioritas: parse JSON field "hostname"
            TUNNEL_URL="$(jq -r 'select(.hostname? and (.hostname | contains("trycloudflare.com"))) | "https://" + .hostname' /tmp/cloudflared.json.log 2>/dev/null | head -n 1 || true)"
            # Fallback: regex dari output JSON
            if [[ -z "$TUNNEL_URL" ]]; then
              TUNNEL_URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.json.log 2>/dev/null | head -n 1 || true)"
            fi
            [[ -n "$TUNNEL_URL" ]] && break
            kill -0 "$CF_PID" 2>/dev/null || {
              echo "::error::cloudflared berhenti sebelum URL tersedia."
              tail -n 30 /tmp/cloudflared.json.log || true
              exit 1
            }
            sleep 1
          done
          if [[ -z "$TUNNEL_URL" ]]; then
            echo "::error::Gagal mendapatkan URL Cloudflare Quick Tunnel."
            tail -n 30 /tmp/cloudflared.json.log || true
            exit 1
          fi

          # URL sengaja TIDAK di-echo ke log job; hanya dikirim ke Telegram
          echo "URL tunnel ditemukan, mengirim ke Telegram..."

          # ---------- 4. Fungsi kirim Telegram ----------
          send_telegram() {
            local url="$1"
            local msg
            msg=$(printf '<b>PentAGI Tunnel Ready</b>\nURL: %s\n\nLogin PentAGI:\nEmail: <code>admin@pentagi.com</code>\nPassword: <code>admin</code>\n\nWajib ganti password saat pertama login.' "$url")
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode=HTML \
              --data-urlencode "text=${msg}" > /dev/null || \
              echo "::warning::Gagal kirim notifikasi Telegram."
          }

          send_telegram "$TUNNEL_URL"

          # ---------- 5. Keepalive ----------
          echo "Menjaga tunnel tetap hidup hingga job timeout..."
          while true; do
            sleep 30

            # Restart cloudflared jika mati
            if ! kill -0 "$CF_PID" 2>/dev/null; then
              echo "::warning::cloudflared mati, restart..."
              : > /tmp/cloudflared.json.log   # bersihkan log agar URL lama tidak terbaca
              /tmp/cloudflared tunnel --no-autoupdate --no-tls-verify --output json \
                --url https://127.0.0.1:8443 \
                > /tmp/cloudflared.json.log 2>&1 &
              CF_PID=$!

              NEW_URL=""
              for i in $(seq 1 60); do
                NEW_URL="$(jq -r 'select(.hostname? and (.hostname | contains("trycloudflare.com"))) | "https://" + .hostname' /tmp/cloudflared.json.log 2>/dev/null | head -n 1 || true)"
                if [[ -z "$NEW_URL" ]]; then
                  NEW_URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.json.log 2>/dev/null | head -n 1 || true)"
                fi
                [[ -n "$NEW_URL" ]] && break
                sleep 1
              done

              if [[ -n "$NEW_URL" && "$NEW_URL" != "$TUNNEL_URL" ]]; then
                TUNNEL_URL="$NEW_URL"
                send_telegram "$TUNNEL_URL"
                echo "URL tunnel berubah, notifikasi Telegram dikirim ulang."
              fi
            fi

            # Health check langsung ke PentAGI (tanpa nginx, tanpa Basic Auth)
            if ! curl -kfsS -o /dev/null "https://127.0.0.1:8443/" 2>/dev/null; then
              echo "::warning::PentAGI :8443 tidak merespons."
            fi
          done
