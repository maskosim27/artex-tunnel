                  key = line.split('=', 1)[0].strip()
                  if key in updates:
                      output.append(f'{key}={updates[key]}')
                      found.add(key)
                      continue
              output.append(line)
          for key, value in updates.items():
              if key not in found:
                  output.append(f'{key}={value}')
          path.write_text('\n'.join(output) + '\n')
          path.chmod(0o600)
          PY

          # Keep the agent callback range loopback-only on this ephemeral runner.
          # This protects the runner, but out-of-band callbacks from external targets won't reach it.

          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx apache2-utils
          printf '%s\n' "$BASIC_PASS" | sudo htpasswd -ci /etc/nginx/pentagi.htpasswd "$BASIC_USER"
          sudo chmod 640 /etc/nginx/pentagi.htpasswd

          sudo tee /etc/nginx/conf.d/pentagi-gateway.conf > /dev/null <<'NGINX'
          map $http_upgrade $pentagi_connection_upgrade {
              default upgrade;
              ''      close;
          }

          server {
              listen 127.0.0.1:18080;
              server_name _;
              client_max_body_size 100m;

              location / {
                  auth_basic "Private PentAGI";
                  auth_basic_user_file /etc/nginx/pentagi.htpasswd;

                  proxy_pass https://127.0.0.1:8443;
                  proxy_ssl_verify off;
                  proxy_ssl_server_name on;
                  proxy_http_version 1.1;
                  # Preserve the public Quick Tunnel hostname, not localhost.
                  proxy_set_header Host $http_host;
                  proxy_set_header X-Forwarded-Host $http_host;
                  # Cloudflare terminates public HTTPS and cloudflared connects locally over HTTP.
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-Port 443;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $pentagi_connection_upgrade;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
              }
          }
          NGINX
          sudo nginx -t
          sudo systemctl restart nginx

          echo "Starting PentAGI official Docker Compose stack..."
          docker compose pull
          docker compose up -d

          echo "Waiting for PentAGI HTTPS UI..."
          READY=0
          for i in $(seq 1 90); do
            CODE=$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1:8443/ || true)
            if [[ "$CODE" =~ ^(200|301|302|303|307|308)$ ]]; then
              READY=1
              break
            fi
            sleep 10
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::PentAGI belum siap. Ringkasan container:"
            docker compose ps || true
            docker compose logs --tail=100 pentagi pgvector scraper || true
            exit 1
          fi

          echo "Checking protected gateway with the actual Quick Tunnel hostname..."
          TUNNEL_HOST="${TUNNEL_URL#https://}"
          GATEWAY_CODE=$(curl -sS --max-time 30 \
            -u "$BASIC_USER:$BASIC_PASS" \
            -H "Host: $TUNNEL_HOST" \
            -H "X-Forwarded-Host: $TUNNEL_HOST" \
            -H "X-Forwarded-Proto: https" \
            -o /tmp/pentagi-gateway.body -w '%{http_code}' \
            http://127.0.0.1:18080/ || true)

          if [[ ! "$GATEWAY_CODE" =~ ^(200|301|302|303|307|308)$ ]]; then
            echo "::error::Protected gateway returned HTTP ${GATEWAY_CODE:-unknown}. Collecting diagnostics..."
            echo "--- Docker Compose status ---"
            docker compose ps || true
            echo "--- Nginx config test ---"
            sudo nginx -t || true
            echo "--- Nginx error log (last 100 lines) ---"
            sudo tail -n 100 /var/log/nginx/error.log || true
            echo "--- Nginx access log (last 40 lines) ---"
            sudo tail -n 40 /var/log/nginx/access.log || true
            echo "--- PentAGI / database / scraper logs (last 160 lines) ---"
            docker compose logs --tail=160 pentagi pgvector scraper || true
            echo "--- Direct PentAGI response using the public Host header ---"
            curl -k -sS --max-time 20 -D /tmp/pentagi-upstream.headers \
              -H "Host: $TUNNEL_HOST" \
              https://127.0.0.1:8443/ -o /tmp/pentagi-upstream.body || true
            sed -n '1,30p' /tmp/pentagi-upstream.headers 2>/dev/null || true
            head -c 1200 /tmp/pentagi-upstream.body 2>/dev/null || true
            echo
            exit 1
          fi
          echo "Protected gateway returned HTTP $GATEWAY_CODE"

          MESSAGE=$(printf 'PENTAGI SIAP!\n\nURL: %s\n\nGateway Basic Auth:\nUsername: %s\nPassword: %s\n\nPentAGI application login (default):\nEmail: admin@pentagi.com\nPassword: admin\n\nPENTING: Setelah login pertama, segera ganti password admin di Settings > Account. Jangan bagikan URL dan kredensial gateway.\n\nProvider LLM sudah dikonfigurasi dari GitHub Secrets. DuckDuckGo dan Sploitus aktif. Runner/tunnel berlaku selama workflow berjalan (maksimal 6 jam).' "$TUNNEL_URL" "$BASIC_USER" "$BASIC_PASS")

          RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")
          case "$RESP" in
            *'"ok":true'*) echo "Telegram notification sent. PentAGI is running." ;;
            *) echo "::error::Gagal mengirim notifikasi Telegram. Periksa TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID."; exit 1 ;;
          esac

          echo "Keeping Cloudflare Quick Tunnel alive..."
          wait "$CF_PID"
